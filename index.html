<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplicate Line Remover</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
<link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
<style>
  :root {
    --bg: #f6f7f4; --panel: #ffffff; --ink: #1d2320; --muted: #5d6762;
    --line: #cfd6d1; --accent: #1f6f5b; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a18; --panel: #1d2421; --ink: #e8ede9; --muted: #98a39d;
            --line: #323c37; --accent: #5cc4a6; --accent-ink: #0d1411; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 4px; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 20px; color: var(--muted); }

  .options { display: flex; flex-wrap: wrap; gap: 0 24px; margin-bottom: 12px; }
  label.opt { display: flex; align-items: center; gap: 10px; cursor: pointer;
              min-height: 44px; }                /* comfortable tap target */
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col h2 { font-size: 1rem; margin: 0 0 6px; }
  textarea { display: block; width: 100%; height: 340px; resize: vertical;
             padding: 12px; background: var(--panel); color: var(--ink);
             border: 1px solid var(--line); border-radius: 6px;
             font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; } /* 16px stops zoom-on-focus on phones */
  textarea:focus-visible, button:focus-visible, input:focus-visible
    { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bar { display: flex; align-items: center; justify-content: space-between;
         gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  #status { font-weight: bold; }
  button { background: var(--accent); color: var(--accent-ink); border: 0;
           border-radius: 6px; padding: 12px 22px; min-height: 48px;
           font: inherit; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #loading { color: var(--muted); font-weight: normal; }

  /* Phones and small tablets */
  @media (max-width: 720px) {
    main { padding: 20px 14px 32px; }
    .grid { grid-template-columns: 1fr; }
    textarea { height: 220px; }
    .bar { flex-direction: column; align-items: stretch; }
    button { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1>Duplicate line remover</h1>
  <p class="sub">Paste a list, one item per line. Results update as you type.</p>

  <div class="options">
    <label class="opt"><input type="checkbox" id="ignore-case"> Ignore case</label>
    <label class="opt"><input type="checkbox" id="trim"> Trim spaces</label>
    <label class="opt"><input type="checkbox" id="sort"> Sort A to Z</label>
  </div>

  <div class="grid">
    <div class="col">
      <h2>Your list</h2>
      <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="apple&#10;banana&#10;apple&#10;cherry"></textarea>
    </div>
    <div class="col">
      <h2>Result</h2>
      <textarea id="output" spellcheck="false" readonly></textarea>
    </div>
  </div>

  <div class="bar">
    <span id="status" role="status" aria-live="polite"><span id="loading">Loading Python…</span></span>
    <button id="copy" disabled>Copy result</button>
  </div>
</main>
<script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
